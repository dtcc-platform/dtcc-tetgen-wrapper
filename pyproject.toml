[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.11",
    "numpy>=1.22",
    "packaging",
]
build-backend = "scikit_build_core.build"

[project]
name = "dtcc-tetgen-wrapper"
version = "0.1.0"
description = "Pybind11-powered TetGen bindings with a lightweight Python adapter."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "DTCC Developers" },
]
dependencies = [
    "numpy>=1.22",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/dtcc-platform/dtcc-tetgen-wrapper"
Repository = "https://github.com/dtcc-platform/dtcc-tetgen-wrapper"
"Bug Tracker" = "https://github.com/dtcc-platform/dtcc-tetgen-wrapper/issues"

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.source-dir = "dtcc_tetgen_wrapper/cpp/tetwrap"
wheel.packages = ["dtcc_tetgen_wrapper"]
sdist.include = [
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/licenses/*.txt",
    "/dtcc_tetgen_wrapper/*.py",
    "/dtcc_tetgen_wrapper/cpp/tetwrap/CMakeLists.txt",
    "/dtcc_tetgen_wrapper/cpp/tetwrap/tetwrap.cpp",
    "/tests/*.py",
    "/uv.lock",
]

# Exclude legacy local vendor/binary artifacts even from a developer checkout.
sdist.exclude = ["dtcc_tetgen_wrapper/cpp/tetgen/**", "**/*.so", "**/*.pyd", "**/__pycache__/**", ".pytest_cache/**"]

wheel.exclude = ["dtcc_tetgen_wrapper/cpp/**"]

[tool.scikit-build.cmake.define]
PYBIND11_FINDPYTHON = "ON"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true for stricter checking
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
exclude = ["demos/", "tests/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = "dtcc_tetgen_wrapper.cpp.tetwrap.*"
ignore_missing_imports = true

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
include = '\\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
known_first_party = ["dtcc_tetgen_wrapper"]

[tool.coverage.run]
source = ["dtcc_tetgen_wrapper"]
omit = ["*/tests/*", "*/demos/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == \"__main__\":",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "pytest-timeout"]
lint = ["flake8", "mypy", "black", "isort", "pylint"]
docs = ["sphinx", "sphinx-rtd-theme", "sphinxcontrib-napoleon"]
quality = ["pre-commit", "bandit"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "dtcc_tetgen_wrapper/cpp/tetwrap/CMakeLists.txt" },
    { file = "dtcc_tetgen_wrapper/cpp/tetwrap/tetwrap.cpp" },
]
