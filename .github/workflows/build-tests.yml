name: build-tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  source-install:
    name: Source and packaged install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install from clean source and test
        run: |
          uv sync --locked
          uv run --locked pytest tests
      - name: Build sdist and wheel from sdist
        run: uv build
      - name: Install wheel and test outside checkout
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/wrapper-wheel-env"
          if [ "$RUNNER_OS" = Windows ]; then
            python="$RUNNER_TEMP/wrapper-wheel-env/Scripts/python.exe"
          else
            python="$RUNNER_TEMP/wrapper-wheel-env/bin/python"
          fi
          uv pip install --python "$python" dist/*.whl pytest
          cp -R tests "$RUNNER_TEMP/wrapper-wheel-tests"
          cd "$RUNNER_TEMP"
          "$python" -m pytest wrapper-wheel-tests
