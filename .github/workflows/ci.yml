name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
        exclude:
          # Skip some combinations to save CI time
          - os: macos-latest
            python-version: '3.10'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - uses: astral-sh/setup-uv@v6
    - name: Build and install package
      run: uv sync --locked

    - name: Run tests
      run: |
        uv run --locked pytest tests/ -v --cov=dtcc_tetgen_wrapper --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: uv sync --locked --group lint

    - name: Run black
      run: |
        uv run --locked --group lint black --check --diff dtcc_tetgen_wrapper tests

    - name: Run isort
      run: |
        uv run --locked --group lint isort --check-only --diff dtcc_tetgen_wrapper tests

    - name: Run flake8
      run: |
        uv run --locked --group lint flake8 dtcc_tetgen_wrapper tests --max-line-length=120 --extend-ignore=E203,W503

    - name: Run mypy
      run: |
        uv run --locked --group lint mypy dtcc_tetgen_wrapper --ignore-missing-imports

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: uv sync --locked --group docs

    - name: Build docs
      run: |
        cd docs || mkdir docs
        if [ ! -f conf.py ]; then
          uv run --locked --group docs sphinx-quickstart -q -p "dtcc-tetgen-wrapper" -a "DTCC Platform" -v "0.2.0" --ext-autodoc --ext-napoleon --makefile
        fi
        uv run --locked --group docs sphinx-build -b html . _build/html

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/_build/html
